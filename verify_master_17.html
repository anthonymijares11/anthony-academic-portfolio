12", "viewBox": "0 0 200 200", "svg": "<g>\n          <!-- White background -->\n          <rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"20\" fill=\"#FFFFFF\" stroke=\"#E0E0E0\" stroke-width=\"2\"/>\n          <!-- Left Joy-Con - Red (same as Switch 1) -->\n          <rect x=\"10\" y=\"48\" width=\"52\" height=\"94\" rx=\"26\" fill=\"#E60012\"/>\n          <rect x=\"18\" y=\"64\" width=\"36\" height=\"62\" rx=\"8\" fill=\"#C00010\"/>\n          <!-- Analog stick left -->\n          <circle cx=\"36\" cy=\"76\" r=\"8\" fill=\"#FFFFFF\" opacity=\"0.9\"/>\n          <circle cx=\"36\" cy=\"76\" r=\"4\" fill=\"#E60012\"/>\n          <!-- Center console -->\n          <rect x=\"66\" y=\"34\" width=\"48\" height=\"132\" rx=\"8\" fill=\"#1A1A1A\"/>\n          <rect x=\"70\" y=\"44\" width=\"40\" height=\"112\" rx=\"4\" fill=\"#2A3A5A\"/>\n          <!-- Right Joy-Con - also Red (Switch 2 has both red by default) -->\n          <rect x=\"138\" y=\"48\" width=\"52\" height=\"94\" rx=\"26\" fill=\"#E60012\"/>\n          <rect x=\"146\" y=\"64\" width=\"36\" height=\"62\" rx=\"8\" fill=\"#C00010\"/>\n          <!-- Analog stick right -->\n          <circle cx=\"164\" cy=\"110\" r=\"8\" fill=\"#FFFFFF\" opacity=\"0.9\"/>\n          <circle cx=\"164\" cy=\"110\" r=\"4\" fill=\"#E60012\"/>\n          <!-- \"2\" badge in black circle -->\n          <circle cx=\"158\" cy=\"170\" r=\"22\" fill=\"#000000\"/>\n          <text x=\"158\" y=\"180\"\n            font-family=\"Arial Black, Impact, 'Arial Bold', sans-serif\"\n            font-size=\"30\" font-weight=\"900\"\n            fill=\"#FFFFFF\" text-anchor=\"middle\">2</text>\n          <!-- Nintendo Switch text -->\n          <text x=\"90\" y=\"186\"\n            font-family=\"Arial Black, Impact, 'Arial Bold', sans-serif\"\n            font-size=\"10\" font-weight=\"900\"\n            fill=\"#1A1A1A\" text-anchor=\"middle\"\n            letter-spacing=\"1\">Nintendo Switch</text>\n        </g>"}];
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let loaded = 0;
CONSOLES.forEach((c, idx) => {
  const svgStr = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${c.viewBox}" width="128" height="128">${c.svg}</svg>`;
  const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    loaded++;
    const col = idx % 4;
    const row = Math.floor(idx / 4);
    const x = 40 + col * 300;
    const y = 40 + row * 180;
    
    // Draw background card
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(x, y, 280, 160, 12);
    ctx.fill();
    ctx.stroke();

    // Draw emblem
    ctx.drawImage(img, x + 16, y + 20, 120, 120);

    // Draw label
    ctx.fillStyle = '#ededf0';
    ctx.font = 'bold 15px sans-serif';
    ctx.fillText(c.name, x + 150, y + 60);

    ctx.fillStyle = '#888894';
    ctx.font = '12px monospace';
    ctx.fillText(c.year + ' • ' + c.company, x + 150, y + 84);

    ctx.fillStyle = c.brandColor;
    ctx.font = 'bold 11px monospace';
    ctx.fillText(c.brandColor, x + 150, y + 106);
  };
  img.src = url;
});
</script>
