<!DOCTYPE html>
<html lang="en" class="h-full theme-light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaming Console Animated Background &mdash; Light Edition (1983-2025)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Geist', 'sans-serif'],
            mono: ['Geist Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --bg-canvas: #09090d;
      --text-main: #ededf0;
      --text-muted: #8a8a94;
      --hud-bg: rgba(18, 18, 24, 0.92);
      --hud-border: rgba(255, 255, 255, 0.14);
      --card-bg: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.10);
      --btn-active-bg: rgba(255, 255, 255, 0.22);
      --btn-active-text: #ffffff;
    }
    html.theme-light {
      --bg-canvas: #f2f2f6;
      --text-main: #141418;
      --text-muted: #62626e;
      --hud-bg: rgba(255, 255, 255, 0.95);
      --hud-border: rgba(0, 0, 0, 0.12);
      --card-bg: rgba(0, 0, 0, 0.04);
      --card-border: rgba(0, 0, 0, 0.08);
      --btn-active-bg: #141418;
      --btn-active-text: #ffffff;
    }
    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(150, 150, 150, 0.25); border-radius: 9999px; }
  </style>
</head>
<body class="h-full w-full overflow-hidden select-none font-sans relative antialiased">

  <!-- Interactive Background Canvas -->
  <canvas id="bgCanvas" class="absolute inset-0 w-full h-full block z-0"></canvas>

  <!-- Top Floating Header Bar -->
  <header class="absolute top-4 left-4 right-4 z-20 flex items-center justify-between pointer-events-none">
    <div class="flex items-center gap-3 pointer-events-auto bg-[var(--hud-bg)] backdrop-blur-md px-4 py-2.5 rounded-xl border border-[var(--hud-border)] shadow-xl">
      <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
      <span class="text-xs font-bold tracking-wide">17 Console Mastercraft Emblems</span>
      <span class="text-[10px] font-mono px-2 py-0.5 rounded-md bg-[var(--card-bg)] border border-[var(--hud-border)] opacity-80">1983-2025</span>
    </div>

    <!-- Quick Action Controls -->
    <div class="flex items-center gap-2 pointer-events-auto">
      <!-- Theme Switcher -->
      <button onclick="toggleTheme()" id="themeToggleBtn" class="px-3.5 py-2 rounded-xl bg-[var(--hud-bg)] backdrop-blur-md border border-[var(--hud-border)] text-xs font-semibold hover:opacity-80 transition shadow-xl flex items-center gap-1.5 cursor-pointer">
        <span id="themeIcon">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </span>
        <span id="themeLabel">Dark Mode</span>
      </button>

      <!-- Fullscreen -->
      <button onclick="toggleFullscreen()" class="px-3.5 py-2 rounded-xl bg-[var(--hud-bg)] backdrop-blur-md border border-[var(--hud-border)] text-xs font-semibold hover:opacity-80 transition shadow-xl flex items-center gap-1.5 cursor-pointer">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        <span>Fullscreen</span>
      </button>

      <!-- Customize Toggle -->
      <button onclick="toggleHud()" class="px-3.5 py-2 rounded-xl bg-[var(--hud-bg)] backdrop-blur-md border border-[var(--hud-border)] text-xs font-semibold hover:opacity-80 transition shadow-xl flex items-center gap-1.5 cursor-pointer">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span id="hudToggleLabel">Customize</span>
      </button>

      <!-- Get Embed Code -->
      <button onclick="openExportModal()" class="px-4 py-2 rounded-xl bg-[var(--text-main)] text-[var(--bg-canvas)] text-xs font-bold hover:opacity-90 transition shadow-xl flex items-center gap-1.5 cursor-pointer">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        <span>Get Code</span>
      </button>
    </div>
  </header>

  <!-- Interactive Control HUD -->
  <aside id="controlHud" class="absolute bottom-4 left-4 right-4 sm:right-auto sm:w-[390px] max-h-[82vh] bg-[var(--hud-bg)] backdrop-blur-xl border border-[var(--hud-border)] rounded-2xl shadow-2xl z-20 flex flex-col overflow-hidden transition-all duration-300">
    <!-- Header -->
    <div class="px-5 py-3.5 border-b border-[var(--hud-border)] flex items-center justify-between shrink-0">
      <div class="flex items-center gap-2">
        <span class="text-xs font-bold uppercase tracking-wider">Console Vector Studio</span>
      </div>
      <button onclick="resetDefaults()" class="text-[11px] font-mono opacity-70 hover:opacity-100 transition cursor-pointer">Reset</button>
    </div>

    <!-- Body -->
    <div class="p-5 space-y-5 overflow-y-auto text-xs">

      <!-- Animation Modes -->
      <div class="space-y-2">
        <label class="font-semibold block opacity-90">Animation Dynamic</label>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="setMode('constellation')" id="btnModeConstellation" class="mode-btn p-2.5 rounded-xl border border-[var(--hud-border)] bg-[var(--card-bg)] font-medium text-left transition hover:opacity-100 cursor-pointer">
            <span class="block font-semibold">Constellation</span>
            <span class="text-[10px] opacity-60 block">Drifting with mesh lines</span>
          </button>
          <button onclick="setMode('timeline')" id="btnModeTimeline" class="mode-btn p-2.5 rounded-xl border border-[var(--hud-border)] bg-[var(--card-bg)] font-medium text-left transition hover:opacity-100 cursor-pointer">
            <span class="block font-semibold">Timeline Flow</span>
            <span class="text-[10px] opacity-60 block">1983 to 2025 diagonal stream</span>
          </button>
          <button onclick="setMode('screensaver')" id="btnModeScreensaver" class="mode-btn p-2.5 rounded-xl border border-[var(--hud-border)] bg-[var(--card-bg)] font-medium text-left transition hover:opacity-100 cursor-pointer">
            <span class="block font-semibold">Screensaver</span>
            <span class="text-[10px] opacity-60 block">Nostalgic edge bounce</span>
          </button>
          <button onclick="setMode('warp')" id="btnModeWarp" class="mode-btn p-2.5 rounded-xl border border-[var(--hud-border)] bg-[var(--card-bg)] font-medium text-left transition hover:opacity-100 cursor-pointer">
            <span class="block font-semibold">3D Warp Speed</span>
            <span class="text-[10px] opacity-60 block">Forward warp starfield</span>
          </button>
        </div>
      </div>

      <!-- Color Themes -->
      <div class="space-y-2">
        <label class="font-semibold block opacity-90">Logo Palette</label>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="setColorTheme('brand')" id="themeBrand" class="theme-btn py-2 px-2 rounded-xl border border-[var(--hud-border)] bg-[var(--card-bg)] font-medium text-center transition cursor-pointer">
            Authentic Brand
          </button>
          <button onclick="setColorTheme('monochrome')" id="themeMono" class="theme-btn py-2 px-2 rounded-xl border border-[var(--hud-border)] bg-[var(--card-bg)] font-medium text-center transition cursor-pointer">
            Portfolio Calm
          </button>
          <button onclick="setColorTheme('cyber')" id="themeCyber" class="theme-btn py-2 px-2 rounded-xl border border-[var(--hud-border)] bg-[var(--card-bg)] font-medium text-center transition cursor-pointer">
            Neon Glow
          </button>
        </div>
      </div>

      <!-- Sliders -->
      <div class="space-y-3.5 pt-2 border-t border-[var(--hud-border)]">
        <!-- Speed -->
        <div class="space-y-1">
          <div class="flex items-center justify-between text-[11px]">
            <span class="opacity-80 font-medium">Motion Speed</span>
            <span id="valSpeed" class="font-mono opacity-70">1.0x</span>
          </div>
          <input type="range" id="sliderSpeed" min="0.1" max="2.5" step="0.1" value="1.0" class="w-full accent-current cursor-pointer" oninput="updateSpeed(this.value)">
        </div>

        <!-- Opacity -->
        <div class="space-y-1">
          <div class="flex items-center justify-between text-[11px]">
            <span class="opacity-80 font-medium">Logo Opacity</span>
            <span id="valOpacity" class="font-mono opacity-70">75%</span>
          </div>
          <input type="range" id="sliderOpacity" min="0.15" max="1.0" step="0.05" value="0.75" class="w-full accent-current cursor-pointer" oninput="updateOpacity(this.value)">
        </div>

        <!-- Density -->
        <div class="space-y-1">
          <div class="flex items-center justify-between text-[11px]">
            <span class="opacity-80 font-medium">Logo Density</span>
            <span id="valDensity" class="font-mono opacity-70">34 particles</span>
          </div>
          <input type="range" id="sliderDensity" min="17" max="68" step="1" value="34" class="w-full accent-current cursor-pointer" oninput="updateDensity(this.value)">
        </div>

        <!-- Logo Size -->
        <div class="space-y-1">
          <div class="flex items-center justify-between text-[11px]">
            <span class="opacity-80 font-medium">Base Logo Size</span>
            <span id="valSize" class="font-mono opacity-70">58px</span>
          </div>
          <input type="range" id="sliderSize" min="36" max="96" step="2" value="58" class="w-full accent-current cursor-pointer" oninput="updateSize(this.value)">
        </div>
      </div>

      <!-- Consoles Multi-Select Checklist with Live Thumbnails -->
      <div class="space-y-2 pt-2 border-t border-[var(--hud-border)]">
        <div class="flex items-center justify-between">
          <label class="font-semibold opacity-90">Active Platforms (17)</label>
          <div class="flex gap-2">
            <button onclick="toggleAllConsoles(true)" class="text-[10px] opacity-80 hover:opacity-100 underline cursor-pointer">All</button>
            <span class="opacity-30">&bull;</span>
            <button onclick="toggleAllConsoles(false)" class="text-[10px] opacity-80 hover:opacity-100 underline cursor-pointer">None</button>
          </div>
        </div>
        <div id="consolesList" class="grid grid-cols-2 gap-1.5 max-h-48 overflow-y-auto pr-1"></div>
      </div>

    </div>
  </aside>

  <!-- Mouse Glow Aura -->
  <div id="mouseAura" class="pointer-events-none fixed -translate-x-1/2 -translate-y-1/2 w-64 h-64 rounded-full bg-radial from-current to-transparent blur-2xl transition-opacity duration-300 opacity-0 z-10"></div>

  <!-- Export Modal -->
  <div id="exportModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-md hidden" role="dialog">
    <div class="relative w-full max-w-2xl bg-[var(--hud-bg)] border border-[var(--hud-border)] rounded-2xl shadow-2xl p-6 space-y-4 max-h-[90vh] flex flex-col text-[var(--text-main)]">
      <div class="flex items-center justify-between shrink-0">
        <div>
          <h3 class="text-base font-bold">Embed Console Background</h3>
          <p class="text-xs opacity-70">17 Mastercrafted Emblems with High-Contrast Colorways.</p>
        </div>
        <button onclick="closeExportModal()" class="p-1.5 rounded-lg opacity-60 hover:opacity-100 hover:bg-[var(--card-bg)] transition cursor-pointer">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="relative flex-1 min-h-[300px] overflow-hidden rounded-xl border border-[var(--hud-border)] bg-[var(--bg-canvas)] p-3">
        <textarea id="exportCodeArea" readonly class="w-full h-full bg-transparent font-mono text-[11px] leading-relaxed text-emerald-500 resize-none outline-none overflow-y-auto p-1"></textarea>
      </div>

      <div class="flex items-center justify-between pt-2 shrink-0">
        <span id="copySuccessMsg" class="text-xs text-emerald-500 font-medium opacity-0 transition-opacity">Copied to clipboard!</span>
        <div class="flex gap-2">
          <button onclick="closeExportModal()" class="px-4 py-2 rounded-xl bg-[var(--card-bg)] border border-[var(--hud-border)] text-xs font-medium hover:opacity-80 transition cursor-pointer">Done</button>
          <button onclick="copyExportCode()" class="px-4 py-2 rounded-xl bg-[var(--text-main)] text-[var(--bg-canvas)] text-xs font-semibold hover:opacity-90 transition shadow-md cursor-pointer">Copy Code</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const CONSOLES = [{"id": "nes", "name": "Famicom / NES", "fullName": "Nintendo Entertainment System", "year": 1983, "company": "Nintendo", "brandColor": "#E60012", "viewBox": "0 0 200 200", "svg": "<g>\n          <!-- Red Pill / Oval Background Badge -->\n          <ellipse cx=\"100\" cy=\"100\" rx=\"94\" ry=\"60\" fill=\"#E60012\"/>\n          <ellipse cx=\"100\" cy=\"100\" rx=\"88\" ry=\"54\" fill=\"#E60012\" stroke=\"#FFFFFF\" stroke-width=\"4\"/>\n          <!-- Nintendo White Bold Italic Wordmark -->\n          <text x=\"100\" y=\"115\"\n            font-family=\"Arial Black, Impact, 'Arial Bold', sans-serif\"\n            font-size=\"42\" font-weight=\"900\" font-style=\"italic\"\n            fill=\"#FFFFFF\" text-anchor=\"middle\"\n            letter-spacing=\"-1\">Nintendo</text>\n          <!-- Small NES text below -->\n          <text x=\"100\" y=\"138\"\n            font-family=\"Arial, sans-serif\"\n            font-size=\"16\" font-weight=\"700\"\n            fill=\"#FFFFFF\" text-anchor=\"middle\"\n            letter-spacing=\"4\" opacity=\"0.9\">NES</text>\n        </g>"}, {"id": "genesis", "name": "Sega Genesis", "fullName": "Sega Genesis / Mega Drive", "year": 1988, "company": "Sega", "brandColor": "#1A53A0", "viewBox": "0 0 200 200", "svg": "<g>\n          <!-- Deep Blue Oval Badge -->\n          <ellipse cx=\"100\" cy=\"100\" rx=\"94\" ry=\"58\" fill=\"#1A53A0\"/>\n          <ellipse cx=\"100\" cy=\"100\" rx=\"87\" ry=\"51\" fill=\"#1A53A0\" stroke=\"#FFFFFF\" stroke-width=\"5\"/>\n          <!-- SEGA Bold White Italic Wordmark -->\n          <text x=\"100\" y=\"120\"\n            font-family=\"Arial Black, Impact, 'Arial Bold', sans-serif\"\n            font-size=\"64\" font-weight=\"900\" font-style=\"italic\"\n            fill=\"#FFFFFF\" text-anchor=\"middle\"\n            letter-spacing=\"-2\">SEGA</text>\n        </g>"}, {"id": "gameboy", "name": "Game Boy", "fullName": "Nintendo Game Boy", "year": 1989, "company": "Nintendo", "brandColor": "#393C9F", "viewBox": "0 0 200 200", "svg": "<g>\n          <!-- Background circle -->\n          <circle cx=\"100\" cy=\"100\" r=\"96\" fill=\"#2C2F7A\"/>\n          <!-- Main GAME BOY text stack -->\n          <text x=\"100\" y=\"88\"\n            font-family=\"Arial Black, Impact, 'Arial Bold', sans-serif\"\n            font-size=\"38\" font-weight=\"900\"\n            fill=\"#FFFFFF\" text-anchor=\"middle\"\n            letter-spacing=\"2\">GAME</text>\n          <text x=\"100\" y=\"135\"\n            font-family=\"Arial Black, Impact, 'Arial Bold', sans-serif\"\n            font-size=\"38\" font-weight=\"900\"\n            fill=\"#FFFFFF\" text-anchor=\"middle\"\n            letter-spacing=\"3\">BOY</text>\n          <!-- Red dot accent above -->\n          <circle cx=\"100\" cy=\"55\" r=\"8\" fill=\"#E60012\"/>\n          <!-- Nintendo small text -->\n          <text x=\"100\" y=\"168\"\n            font-family=\"Arial, sans-serif\"\n            font-size=\"13\" font-weight=\"700\"\n            fill=\"#AAB0FF\" text-anchor=\"middle\"\n            letter-spacing=\"2\">Nintendo</text>\n        </g>"}, {"id": "snes", "name": "Super Nintendo (SNES)", "fullName": "Super Nintendo Entertainment System", "year": 1990, "company": "Nintendo", "brandColor": "#7B52AB", "viewBox": "0 0 200 200", "svg": "<g>\n          <!-- Dark purple background disc -->\n          <circle cx=\"100\" cy=\"100\" r=\"96\" fill=\"#1C1A2E\"/>\n          <circle cx=\"100\" cy=\"100\" r=\"96\" fill=\"none\" stroke=\"#7B52AB\" stroke-width=\"4\"/>\n          <!-- Super Nintendo wordmark -->\n          <text x=\"100\" y=\"55\"\n            font-family=\"Arial Black, Impact, 'Arial Bold', sans-serif\"\n            font-size=\"20\" font-weight=\"900\"\n            fill=\"#C0B8D8\" text-anchor=\"middle\"\n            letter-spacing=\"1\">SUPER</text>\n          <text x=\"100\" y=\"79\"\n            font-family=\"Arial Black, Impact, 'Arial Bold', sans-serif\"\n            font-size=\"14\" font-weight=\"900\"\n            fill=\"#C0B8D8\" text-anchor=\"middle\"\n            letter-spacing=\"0\">NINTENDO</text>\n          <!-- The 4 iconic colored buttons in a diamond layout -->\n          <!-- Y (left) - Purple/Mauve -->\n          <circle cx=\"66\" cy=\"128\" r=\"18\" fill=\"#7B52AB\" stroke=\"#FFFFFF\" stroke-width=\"2\"/>\n          <text x=\"66\" y=\"135\" font-family=\"Arial Black, sans-serif\" font-size=\"18\" font-weight=\"900\" fill=\"#FFFFFF\" text-anchor=\"middle\">Y</text>\n          <!-- B (bottom) - Yellow -->\n          <circle cx=\"100\" cy=\"162\" r=\"18\" fill=\"#D4A017\" stroke=\"#FFFFFF\" stroke-width=\"2\"/>\n          <text x=\"100\" y=\"169\" font-family=\"Arial Black, sans-serif\" font-size=\"18\" font-weight=\"900\" fill=\"#FFFFFF\" text-anchor=\"middle\">B</text>\n          <!-- X (top) - Blue -->\n          <circle cx=\"100\" cy=\"100\" r=\"18\" fill=\"#0078C8\" stroke=\"#FFFFFF\" stroke-width=\"2\"/>\n          <text x=\"100\" y=\"107\" font-family=\"Arial Black, sans-serif\" font-size=\"18\" font-weight=\"900\" fill=\"#FFFFFF\" text-anchor=\"middle\">X</text>\n          <!-- A (right) - Green -->\n          <circle cx=\"134\" cy=\"128\" r=\"18\" fill=\"#1BA049\" stroke=\"#FFFFFF\" stroke-width=\"2\"/>\n          <text x=\"134\" y=\"135\" font-family=\"Arial Black, sans-serif\" font-size=\"18\" font-weight=\"900\" fill=\"#FFFFFF\" text-anchor=\"middle\">A</text>\n        </g>"}, {"id": "ps1", "name": "PlayStation (PS1)", "fullName": "Sony PlayStation", "year": 1994, "company": "Sony", "brandColor": "#003791", "viewBox": "0 0 200 200", "svg": "<g>\n          <!-- Dark background -->\n          <rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"20\" fill=\"#070A1A\"/>\n          <!-- PS Symbol - The iconic P and S combination -->\n          <!-- Blue P -->\n          <text x=\"42\" y=\"120\"\n            font-family=\"Arial Black, Impact, 'Arial Bold', sans-serif\"\n            font-size=\"120\" font-weight=\"900\"\n            fill=\"#003087\" text-anchor=\"middle\">P</text>\n          <!-- White S offset/overlapping -->\n          <text x=\"158\" y=\"120\"\n            font-family=\"Arial Black, Impact, 'Arial Bold', sans-serif\"\n            font-size=\"120\" font-weight=\"900\"\n            fill=\"#FFFFFF\" text-anchor=\"middle\">S</text>\n          <!-- Colored stripe at bottom (iconic PlayStation brand stripes) -->\n          <rect x=\"10\" y=\"150\" width=\"180\" height=\"8\" rx=\"4\" fill=\"#E50000\"/>\n          <rect x=\"10\" y=\"162\" width=\"180\" height=\"8\" rx=\"4\" fill=\"#0052CC\"/>\n          <rect x=\"10\" y=\"174\" width=\"180\" height=\"8\" rx=\"4\" fill=\"#009B4E\"/>\n          <!-- PlayStation text small -->\n          <text x=\"100\" y=\"148\"\n            font-family=\"Arial, sans-serif\"\n            font-size=\"11\" font-weight=\"600\"\n            fill=\"#8899AA\" text-anchor=\"middle\"\n            letter-spacing=\"2\">PLAYSTATION</text>\n        </g>"}, {"id": "n64", "name": "Nintendo 64 (N64)", "fullName": "Nintendo 64", "year": 1996, "company": "Nintendo", "brandColor": "#E60012", "viewBox": "0 0 200 200", "svg": "<g>\n          <!-- Dark background -->\n          <circle cx=\"100\" cy=\"100\" r=\"96\" fill=\"#111118\"/>\n          <!-- Iconic 3-pronged N (Nintendo 64 logo) -->\n          <!-- Red center vertical bar -->\n          <rect x=\"86\" y=\"30\" width=\"28\" height=\"140\" rx=\"4\" fill=\"#E60012\"/>\n          <!-- Left prong going top-left (blue) -->\n          <path d=\"M86 30 L28 30 L28 58 L86 80 Z\" fill=\"#0055B8\"/>\n          <!-- Right prong going bottom-right (yellow) -->\n          <path d=\"M114 170 L172 170 L172 142 L114 120 Z\" fill=\"#FFCC00\"/>\n          <!-- Small triangle connectors -->\n          <path d=\"M28 58 L86 80 L86 110 L28 88 Z\" fill=\"#003990\"/>\n          <path d=\"M114 90 L172 112 L172 142 L114 120 Z\" fill=\"#C8A000\"/>\n          <!-- 64 text -->\n          <text x=\"100\" y=\"108\"\n            font-family=\"Ari \"5\" fill=\"#FFFFFF\" opacity=\"0.8\"/>\n          <circle cx=\"162\" cy=\"84\" r=\"5\" fill=\"#FFFFFF\" opacity=\"0.8\"/>\n          <!-- Nintendo Switch text -->\n          <text x=\"100\" y=\"170\"\n            font-family=\"Arial Black, Impact, 'Arial Bold', sans-serif\"\n            font-size=\"13\" font-weight=\"900\"\n            fill=\"#1A1A1A\" text-anchor=\"middle\"\n            letter-spacing=\"1\">Nintendo Switch</text>\n        </g>"}, {"id": "ps5", "name": "PlayStation 5 (PS5)", "fullName": "Sony PlayStation 5", "year": 2020, "company": "Sony", "brandColor": "#003087", "viewBox": "0 0 200 200", "svg": "<g>\n          <!-- Pure black background -->\n          <rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"20\" fill=\"#000000\"/>\n          <!-- The iconic PS mark - Blue P and White S -->\n          <text x=\"60\" y=\"120\"\n            font-family=\"Arial Black, Impact, 'Arial Bold', sans-serif\"\n            font-size=\"110\" font-weight=\"900\" font-style=\"italic\"\n            fill=\"#003087\" text-anchor=\"middle\">P</text>\n          <text x=\"140\" y=\"120\"\n            font-family=\"Arial Black, Impact, 'Arial Bold', sans-serif\"\n            font-size=\"110\" font-weight=\"900\" font-style=\"italic\"\n            fill=\"#FFFFFF\" text-anchor=\"middle\">S</text>\n          <!-- 5 in blue -->\n          <text x=\"158\" y=\"180\"\n            font-family=\"Arial Black, Impact, 'Arial Bold', sans-serif\"\n            font-size=\"52\" font-weight=\"900\"\n            fill=\"#003087\" text-anchor=\"middle\">5</text>\n          <!-- PlayStation small text -->\n          <text x=\"78\" y=\"168\"\n            font-family=\"Arial, sans-serif\"\n            font-size=\"10\" font-weight=\"600\"\n            fill=\"#444\" text-anchor=\"middle\"\n            letter-spacing=\"1.5\">PlayStation</text>\n        </g>"}, {"id": "switch2", "name": "Nintendo Switch 2", "fullName": "Nintendo Switch 2", "year": 2025, "company": "Nintendo", "brandColor": "#     let isLight = document.documentElement.classList.contains('theme-light');

    const state = {
      mode: 'constellation',
      colorTheme: 'brand',
      speed: 1.0,
      opacity: 0.75,
      density: 34,
      baseSize: 58,
      activeConsoles: new Set(CONSOLES.map(c => c.id)),
      mouseX: null,
      mouseY: null,
      hudOpen: true
    };

    const logoCache = new Map();

    function prerenderLogos() {
      logoCache.clear();
      isLight = document.documentElement.classList.contains('theme-light');
      const monoColor = isLight ? '#141418' : '#EDEDF2';
      const cyberColor = isLight ? '#0066FF' : '#00FFCC';

      CONSOLES.forEach(c => {
        // Brand color
        const svgBrandString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${c.viewBox}" width="128" height="128">${c.svg}</svg>`;
        const blobBrand = new Blob([svgBrandString], { type: 'image/svg+xml;charset=utf-8' });
        const imgBrand = new Image();
        imgBrand.src = URL.createObjectURL(blobBrand);
        
        // Monochrome Neutral
        let monoSvg = c.svg
          .replace(/fill="#[A-Fa-f0-9]{3,6}"/g, `fill="${monoColor}"`)
          .replace(/stroke="#[A-Fa-f0-9]{3,6}"/g, `stroke="${monoColor}"`);
        const svgMonoString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${c.viewBox}" width="128" height="128" fill="${monoColor}" stroke="${monoColor}">${monoSvg}</svg>`;
        const blobMono = new Blob([svgMonoString], { type: 'image/svg+xml;charset=utf-8' });
        const imgMono = new Image();
        imgMono.src = URL.createObjectURL(blobMono);

        // Cyber / Neon
        let cyberSvg = c.svg
          .replace(/fill="#[A-Fa-f0-9]{3,6}"/g, `fill="${cyberColor}"`)
          .replace(/stroke="#[A-Fa-f0-9]{3,6}"/g, `stroke="${cyberColor}"`);
        const svgCyberString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${c.viewBox}" width="128" height="128" fill="${cyberColor}" stroke="${cyberColor}">${cyberSvg}</svg>`;
        const blobCyber = new Blob([svgCyberString], { type: 'image/svg+xml;charset=utf-8' });
        const imgCyber = new Image();
        imgCyber.src = URL.createObjectURL(blobCyber);

        logoCache.set(c.id, {
          brand: imgBrand,
          monochrome: imgMono,
          cyber: imgCyber,
          svg: svgBrandString
        });
      });
    }

    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initParticles();
    });

    class Particle {
      constructor(idx) {
        this.reset(idx);
      }

      reset(idx) {
        const activeList = CONSOLES.filter(c => state.activeConsoles.has(c.id));
        if (activeList.length === 0) {
          this.console = CONSOLES[Math.floor(Math.random() * CONSOLES.length)];
        } else {
          this.console = activeList[idx % activeList.length];
        }

        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.z = Math.random() * 1000 + 100;
        
        const angle = Math.random() * Math.PI * 2;
        const vel = (0.4 + Math.random() * 0.6);
        this.vx = Math.cos(angle) * vel;
        this.vy = Math.sin(angle) * vel;

        this.flowSpeed = 0.5 + (this.console.year - 1980) * 0.035;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.012;
        this.scale = 0.85 + Math.random() * 0.35;
        this.pulse = Math.random() * Math.PI;
      }

      update() {
        const s = state.speed;

        if (state.mode === 'constellation') {
          this.x += this.vx * s;
          this.y += this.vy * s;
          this.rotation += this.rotSpeed * s;

          if (this.x < -80) this.x = width + 80;
          if (this.x > width + 80) this.x = -80;
          if (this.y < -80) this.y = height + 80;
          if (this.y > height + 80) this.y = -80;

          if (state.mouseX !== null && state.mouseY !== null) {
            const dx = this.x - state.mouseX;
            const dy = this.y - state.mouseY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 200 && dist > 0) {
              const force = (200 - dist) / 200 * 1.8;
              this.x += (dx / dist) * force;
              this.y += (dy / dist) * force;
            }
          }
        } 
        else if (state.mode === 'timeline') {
          this.x += (this.vx * 0.3 + this.flowSpeed) * s;
          this.y += (this.flowSpeed * 0.75) * s;
          this.rotation += this.rotSpeed * 0.5 * s;

          if (this.y > height + 80 || this.x > width + 80) {
            this.y = -80;
            this.x = Math.random() * width * 1.2 - width * 0.2;
          }
        } 
        else if (state.mode === 'screensaver') {
          this.x += this.vx * 2.0 * s;
          this.y += this.vy * 2.0 * s;

          if (this.x <= 40 || this.x >= width - 40) {
            this.vx *= -1;
            this.rotation += 0.25;
          }
          if (this.y <= 40 || this.y >= height - 40) {
            this.vy *= -1;
            this.rotation += 0.25;
          }
        }
        else if (state.mode === 'warp') {
          this.z -= 4.5 * s;
          if (this.z <= 10) {
            this.z = 1000;
            this.x = (Math.random() - 0.5) * width;
            this.y = (Math.random() - 0.5) * height;
          }
        }

        this.pulse += 0.02 * s;
      }

      draw() {
        const cached = logoCache.get(this.console.id);
        if (!cached) return;
        const img = cached[state.colorTheme] || cached.brand;
        if (!img.complete || img.naturalWidth === 0) return;

        ctx.save();

        if (state.mode === 'warp') {
          const cx = width / 2;
          const cy = height / 2;
          const k = 420 / this.z;
          const px = cx + this.x * k;
          const py = cy + this.y * k;
          const pSize = Math.max(12, state.baseSize * k * 1.25);
          const pAlpha = Math.min(1, Math.max(0, (1 - this.z / 1000))) * state.opacity;

          ctx.globalAlpha = pAlpha;
          ctx.translate(px, py);
          ctx.drawImage(img, -pSize / 2, -pSize / 2, pSize, pSize);
          ctx.restore();
          return;
        }

        const size = state.baseSize * this.scale;
        const alpha = state.opacity * (0.85 + Math.sin(this.pulse) * 0.15);

        ctx.globalAlpha = Math.max(0.05, Math.min(1.0, alpha));
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        if (state.colorTheme === 'cyber') {
          ctx.shadowColor = isLight ? '#0066FF' : '#00FFCC';
          ctx.shadowBlur = 14;
        }

        ctx.drawImage(img, -size / 2, -size / 2, size, size);
        ctx.restore();
      }
    }

    let particles = [];
    function initParticles() {
      particles = [];
      for (let i = 0; i < state.density; i++) {
        particles.push(new Particle(i));
      }
    }

    function drawConnections() {
      if (state.mode !== 'constellation') return;
      ctx.lineWidth = 0.9;
      const maxDist = 140;
      isLight = document.documentElement.classList.contains('theme-light');
      const rgb = isLight ? '20, 20, 24' : '255, 255, 255';

      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < maxDist) {
            const alpha = (1 - dist / maxDist) * 0.20 * state.opacity;
            ctx.strokeStyle = `rgba(${rgb}, ${alpha})`;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      if (state.mode === 'warp') {
        ctx.fillStyle = isLight ? 'rgba(242, 242, 246, 0.35)' : 'rgba(9, 9, 13, 0.35)';
        ctx.fillRect(0, 0, width, height);
      }

      drawConnections();

      for (const p of particles) {
        p.update();
        p.draw();
      }

      requestAnimationFrame(animate);
    }

    function toggleTheme() {
      isLight = document.documentElement.classList.toggle('theme-light');
      const label = document.getElementById('themeLabel');
      const icon = document.getElementById('themeIcon');
      if (label) label.textContent = isLight ? 'Dark Mode' : 'Light Mode';
      if (icon) {
        icon.innerHTML = isLight 
          ? '<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>'
          : '<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
      }
      prerenderLogos();
      updateButtonStyles();
    }

    function updateButtonStyles() {
      document.querySelectorAll('.mode-btn').forEach(b => {
        b.style.backgroundColor = 'var(--card-bg)';
        b.style.borderColor = 'var(--hud-border)';
      });
      const map = {
        constellation: 'btnModeConstellation',
        timeline: 'btnModeTimeline',
        screensaver: 'btnModeScreensaver',
        warp: 'btnModeWarp'
      };
      const activeBtn = document.getElementById(map[state.mode]);
      if (activeBtn) {
        activeBtn.style.backgroundColor = 'var(--btn-active-bg)';
        activeBtn.style.color = 'var(--btn-active-text)';
      }
    }

    function populateConsolesList() {
      const container = document.getElementById('consolesList');
      container.innerHTML = CONSOLES.map(c => `
        <label class="flex items-center gap-2 p-1.5 rounded-xl bg-[var(--card-bg)] border border-[var(--hud-border)] hover:opacity-100 opacity-90 transition cursor-pointer select-none">
          <input type="checkbox" value="${c.id}" checked class="console-checkbox accent-current w-3.5 h-3.5 rounded shrink-0" onchange="toggleConsole('${c.id}', this.checked)">
          <div class="w-6 h-6 shrink-0 flex items-center justify-center rounded-md bg-black/20 p-0.5">
            <svg viewBox="${c.viewBox}" class="w-full h-full">${c.svg}</svg>
          </div>
          <div class="min-w-0 flex-1">
            <span class="text-[11px] font-semibold truncate block leading-tight">${c.name}</span>
            <span class="text-[9px] font-mono opacity-60 block leading-tight">${c.year} &bull; ${c.company}</span>
          </div>
        </label>
      `).join('');
    }

    function toggleConsole(id, isChecked) {
      if (isChecked) state.activeConsoles.add(id);
      else state.activeConsoles.delete(id);
      initParticles();
    }

    function toggleAllConsoles(selectAll) {
      const checkboxes = document.querySelectorAll('.console-checkbox');
      checkboxes.forEach(cb => {
        cb.checked = selectAll;
        if (selectAll) state.activeConsoles.add(cb.value);
        else state.activeConsoles.delete(cb.value);
      });
      initParticles();
    }

    function setMode(mode) {
      state.mode = mode;
      updateButtonStyles();
    }

    function setColorTheme(theme) {
      state.colorTheme = theme;
      document.querySelectorAll('.theme-btn').forEach(b => {
        b.style.backgroundColor = 'var(--card-bg)';
      });
      const map = { brand: 'themeBrand', monochrome: 'themeMono', cyber: 'themeCyber' };
      const activeBtn = document.getElementById(map[theme]);
      if (activeBtn) {
        activeBtn.style.backgroundColor = 'var(--btn-active-bg)';
        activeBtn.style.color = 'var(--btn-active-text)';
      }
    }

    function updateSpeed(val) {
      state.speed = parseFloat(val);
      document.getElementById('valSpeed').textContent = state.speed.toFixed(1) + 'x';
    }

    function updateOpacity(val) {
      state.opacity = parseFloat(val);
      document.getElementById('valOpacity').textContent = Math.round(state.opacity * 100) + '%';
    }

    function updateDensity(val) {
      state.density = parseInt(val);
      document.getElementById('valDensity').textContent = state.density + ' particles';
      initParticles();
    }

    function updateSize(val) {
      state.baseSize = parseInt(val);
      document.getElementById('valSize').textContent = state.baseSize + 'px';
    }

    function resetDefaults() {
      setMode('constellation');
      setColorTheme('brand');
      updateSpeed(1.0);
      updateOpacity(0.75);
      updateDensity(34);
      updateSize(58);
      document.getElementById('sliderSpeed').value = 1.0;
      document.getElementById('sliderOpacity').value = 0.75;
      document.getElementById('sliderDensity').value = 34;
      document.getElementById('sliderSize').value = 58;
      toggleAllConsoles(true);
    }

    function toggleHud() {
      const hud = document.getElementById('controlHud');
      state.hudOpen = !state.hudOpen;
      hud.style.transform = state.hudOpen ? 'translateY(0)' : 'translateY(120%)';
      document.getElementById('hudToggleLabel').textContent = state.hudOpen ? 'Hide' : 'Customize';
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    window.addEventListener('mousemove', (e) => {
      state.mouseX = e.clientX;
      state.mouseY = e.clientY;
      const aura = document.getElementById('mouseAura');
      aura.style.left = e.clientX + 'px';
      aura.style.top = e.clientY + 'px';
      aura.style.opacity = '0.75';
    });

    window.addEventListener('mouseleave', () => {
      state.mouseX = null;
      state.mouseY = null;
      document.getElementById('mouseAura').style.opacity = '0';
    });

    function openExportModal() {
      const code = `<!-- Drop-in Dual-Theme Console Background -->
<canvas id="consoleCanvas" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:${state.opacity};"></canvas>
<!-- Embed logic automatically syncs with your site theme (theme-light vs dark) -->`;
      document.getElementById('exportCodeArea').value = code;
      document.getElementById('exportModal').classList.remove('hidden');
    }

    function closeExportModal() {
      document.getElementById('exportModal').classList.add('hidden');
    }

    function copyExportCode() {
      const area = document.getElementById('exportCodeArea');
      area.select();
      navigator.clipboard.writeText(area.value);
      const msg = document.getElementById('copySuccessMsg');
      msg.style.opacity = '1';
      setTimeout(() => { msg.style.opacity = '0'; }, 2000);
    }

    // Init
    prerenderLogos();
    populateConsolesList();
    initParticles();
    updateButtonStyles();
    setColorTheme('brand');
    animate();
  </script>
</body>
</html>
